name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'deployment.yaml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
        # git clone https://github.com/yourname/your-repo.git
        # cd your-repo

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Generate timestamp tag
        id: tag
        run: echo "VERSION=$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_ENV
        # VERSION=2025-12-11-143025
        # Image name: 
        # miguelvilasboas/hello-world:2025-12-11-090512

      - name: Build and Push Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/hello-world:${{ env.VERSION }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/hello-world:${{ env.VERSION }}

      - name: Update deployment.yaml and commit
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/hello-world:${{ env.VERSION }}|" deployment.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Deploy new image ${{ env.VERSION }}"
          git push
